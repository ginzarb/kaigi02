<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぎんざRuby会議02</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #fff;
      color: #222;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #cc0000;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.4rem;
    }
    main {
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.1rem;
    }
    .info-table th,
    .info-table td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }
    .info-table th {
      width: 7rem;
      color: #666;
      font-weight: normal;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>ぎんざRuby会議02</h1>
  </header>
  <main>
    <table class="info-table">
      <tr>
        <th>開催日</th>
        <td>2027年1月23日（土）</td>
      </tr>
      <tr>
        <th>会場</th>
        <td>株式会社マイベスト イベントスペース</td>
      </tr>
    </table>
  </main>
</body>
</html>
